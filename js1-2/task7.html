<!DOCTYPE html>
<html>
<head>
  <title>Task 7</title>
</head>
<body>
  <p id="result"></p>
  <script>
    let rolls = Number(prompt("How many dice rolls?"));
    let sum = 0;
    for (let i = 0; i < rolls; i++) {
      let die = Math.floor(Math.random() * 6) + 1;
      sum = sum + die;
    }
    document.getElementById("result").innerHTML = "Sum: " + sum;
  </script>
</body>
</html>
