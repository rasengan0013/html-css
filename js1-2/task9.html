<!DOCTYPE html>
<html>
<head>
  <title>Task 9</title>
</head>
<body>
  <p id="result"></p>
  <script>
    let number = Number(prompt("Enter a number:"));
    let prime = true;
    if (number < 2) {
      prime = false;
    }
    for (let i = 2; i < number; i++) {
      if (number % i == 0) {
        prime = false;
      }
    }
    if (prime) {
      document.getElementById("result").innerHTML = number + " is a prime number.";
    } else {
      document.getElementById("result").innerHTML = number + " is not a prime number.";
    }
  </script>
</body>
</html>
